<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="bidi-lab splitting one line into LTR, neutral and RTL runs">
  <title>bidi-lab splitting one line into LTR, neutral and RTL runs</title>
  <defs>
    <linearGradient id="lab" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#e879f9"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="320" fill="#06070b"/>

  <text x="64" y="88" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="38" fill="#f8fafc">bidi<tspan fill="url(#lab)">-lab</tspan></text>
  <text x="1216" y="62" text-anchor="end" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#3f4d63">character-level bidi diagnostics</text>

  <rect x="64" y="136" width="280" height="64" rx="8" fill="#1d4ed8"/>
  <text x="204" y="178" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="22" fill="#eef2ff">iPhone</text>

  <rect x="344" y="136" width="88" height="64" rx="8" fill="#111827" stroke="#1f2937"/>
  <text x="388" y="178" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="22" fill="#64748b">&#183;</text>

  <rect x="432" y="136" width="300" height="64" rx="8" fill="#15803d"/>
  <text x="582" y="179" text-anchor="middle" direction="rtl" font-family="Tahoma, 'Segoe UI', sans-serif" font-size="26" fill="#f0fdf4">الجديد</text>

  <g font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" letter-spacing="2" fill="#4b5a72" text-anchor="middle">
    <text x="204" y="224">LTR</text>
    <text x="388" y="224">NEUTRAL</text>
    <text x="582" y="224">RTL</text>
  </g>

  <path d="M800 112v152" stroke="#151b26"/>

  <g font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13">
    <text x="840" y="128" font-size="11" letter-spacing="2" fill="#3f4d63">ISSUES</text>
    <rect x="840" y="146" width="7" height="7" rx="2" fill="#f87171"/>
    <text x="860" y="154" fill="#94a3b8">latinInitial &#183; line 1</text>
    <rect x="840" y="178" width="7" height="7" rx="2" fill="#fbbf24"/>
    <text x="860" y="186" fill="#94a3b8">stray RLM @ 12</text>
    <rect x="840" y="210" width="7" height="7" rx="2" fill="#f87171"/>
    <text x="860" y="218" fill="#94a3b8">legacy RLE @ 0</text>
  </g>

  <text x="64" y="288" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#3f4d63">addingRTLMarks(to: line) &#8594; prefix U+200F</text>
</svg>
