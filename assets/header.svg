<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="bidi-lab — see why your Arabic line renders sideways">
  <title>bidi-lab — see why your Arabic line renders sideways</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a0a14"/>
      <stop offset="0.55" stop-color="#111025"/>
      <stop offset="1" stop-color="#1a1030"/>
    </linearGradient>
    <linearGradient id="accent" x1="560" y1="0" x2="1180" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(1080 50) rotate(90) scale(300)">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#glow)"/>

  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <path d="M0 80h1280M0 160h1280M0 240h1280"/>
    <path d="M160 0v320M320 0v320M480 0v320M640 0v320M800 0v320M960 0v320M1120 0v320"/>
  </g>

  <rect width="1280" height="4" fill="url(#accent)"/>

  <g font-family="'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace">
    <rect x="64" y="56" width="286" height="30" rx="15" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="82" y="76" font-size="12" letter-spacing="2.4" fill="#c4b5fd">SWIFT &#183; BIDI &#183; RTL DEBUG</text>
    <text x="60" y="176" font-size="72" font-weight="700" letter-spacing="-3" fill="#f8fafc">bidi<tspan fill="url(#accent)">-lab</tspan></text>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <text x="64" y="216" font-size="20" fill="#94a3b8">See why a mixed Arabic line renders sideways.</text>
    <text x="64" y="256" font-size="13" letter-spacing="1.6" fill="#64748b">RUNS &#183; RLM &#183; STRAY CONTROLS &#183; LEGACY EMBEDDINGS</text>
  </g>

  <g>
    <rect x="700" y="66" width="516" height="188" rx="18" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.1"/>

    <text x="732" y="100" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" letter-spacing="2.2" fill="#64748b">BEFORE</text>
    <text x="732" y="132" font-family="Tahoma, 'Segoe UI', sans-serif" font-size="19" fill="#fbbf24">iPhone الجديد</text>
    <text x="732" y="152" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#78716c">paragraph: LTR &#183; punctuation misplaced</text>

    <path d="M732 168h452" stroke="#ffffff" stroke-opacity="0.08"/>

    <text x="732" y="196" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" letter-spacing="2.2" fill="#64748b">AFTER</text>
    <text x="732" y="228" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="19" fill="#4ade80">&#8207;iPhone الجديد</text>
    <text x="732" y="248" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#4ade80">paragraph: RTL &#183; 2 runs &#183; 1 latinInitial</text>
  </g>
</svg>
